; Steam Workshop metadata for the Sea Power mod manager.
; Used when distributing the plugin through the Workshop alongside Anchor Chain.
; Copy this folder (with SeaPowerNightVision.dll next to it) into
; Sea Power/Sea Power_Data/StreamingAssets/ or upload it as a Workshop item.

[Language_en]
Name=Night Vision (Toggleable)
Description=Adds a toggleable night vision mode. Press Ctrl+N during a mission to drop the tubes: image-intensifier gain, phosphor tint, ambient light amplification, optional vignette/scanlines. Ctrl+Shift+N cycles Gen-3 green, white phosphor, neutral low-light boost and amber. Ctrl+PageUp / Ctrl+PageDown adjust gain. Everything is configurable in BepInEx/config.

[Compatibility]
; Second compatibility check: MAJOR and MINOR must match, a higher PATCH is accepted.
ApproximateVersion=0.6.8
